
<div class="contact-form-container">
  <div data-fs-success class="form-message form-success"
       role="status" aria-live="polite">
  </div>

  <div data-fs-error class="form-message form-error"
       role="alert" aria-live="assertive">
  </div>

  <form
    id="contact-form"
    class="contact-form"
    action="https://formspree.io/f/mjygjywq"
    method="POST"
  >
    <div class="form-group">
      <label for="nome">Nome</label>
      <input
        id="nome"
        type="text"
        name="nome"
        autocomplete="name"
        required
        data-fs-field
      />
      <span data-fs-error="nome" class="field-error"></span>
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        autocomplete="email"
        required
        data-fs-field
      />
      <span data-fs-error="email" class="field-error"></span>
    </div>

    <div class="form-group">
      <label for="telemovel">Telemóvel (opcional)</label>
      <input
        id="telemovel"
        type="tel"
        name="telemovel"
        autocomplete="tel"
        data-fs-field
      />
      <span data-fs-error="telemovel" class="field-error"></span>
    </div>

    <div class="form-group">
      <label for="mensagem">A tua mensagem</label>
      <textarea
        id="mensagem"
        name="mensagem"
        rows="6"
        required
        data-fs-field
      ></textarea>
      <span data-fs-error="mensagem" class="field-error"></span>
    </div>

    <div class="form-group privacy-consent">
      <label for="privacidade">
        <input
          id="privacidade"
          type="checkbox"
          name="consentimento_privacidade"
          value="Aceito"
          required
        />
        Li e aceito a
        <a href="politica-privacidade.html">
          Política de Privacidade
        </a>.
      </label>
    </div>

    <input
      type="hidden"
      name="_subject"
      value="Nova mensagem através do site Bizitza Núcleo do Ser"
    />

    <button type="submit" data-fs-submit-btn>
      Enviar mensagem
    </button>
  </form>
</div>


<script>
  window.formspree = window.formspree || function () {
    (formspree.q = formspree.q || []).push(arguments);
  };

  formspree('initForm', {
    formElement: '#contact-form',
    formId: 'mjygjywq'
  });
</script>
<script
  src="https://unpkg.com/@formspree/ajax@1"
  defer
></script>
</body>
